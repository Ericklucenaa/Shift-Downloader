<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHIFT</title>
    <script>
      // Tema antes de pintar, para não piscar. A preferência salva vem do núcleo depois.
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('shift.theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        try { document.documentElement.dataset.buttons = localStorage.getItem('shift.buttons') === 'classic' ? 'classic' : 'liquid'; } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
