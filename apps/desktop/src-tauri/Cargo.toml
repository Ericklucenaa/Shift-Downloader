[package]
name = "shift-desktop"
description = "SHIFT Download Manager"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "shift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shift-core = { path = "../../../crates/core" }
shift-media = { path = "../../../crates/media" }
shift-security = { path = "../../../crates/security" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.2", features = ["v4"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
winreg = "0.56.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
