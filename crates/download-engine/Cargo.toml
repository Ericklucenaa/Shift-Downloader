[package]
name = "shift-download-engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "sync", "rt", "macros", "net", "io-util"] }
tracing = "0.1.44"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
